<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Valentine App</title>
</head>
<body>
    <div class="container">
        <div class="left">
            
             <h1 class="title">Will you be my Valentine? 💐</h1>
             <img id="questionGif"src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExYW1kYmIzZ2NiNWg5YmI1ZGY0czZucDlldXA0N29ucTBhdDdwZmVwMSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/OJvDJvIGIVx6QSBJhg/giphy.gif" alt="asking gif" class="question-gif"/>

             <p id="description">A tiny page full of love, chaos and pink vibes 💕</p>
   
             <div class="buttons">
                <button id="yesBtn">Yes ❤️</button>
                <button id="noBtn">No 🙄</button> 
             </div>
         </div>
         <div class="result" class="hidden">  
            <h2>Yaaay!!!  🥺🥳</h2>
            <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExaDI5ZmI2b3dxNTZ4cDB5YzN0NnowMDhmeHdlc3JtZnA4ZzZlZGN4MSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/zFHu7yuSHm4H5gNZVx/giphy.gif" alt="flowers">
        </div>

    </div>

    <script src="index.js"></script>
    
</body>
</html>
