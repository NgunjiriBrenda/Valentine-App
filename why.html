<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Why not?</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="container">
        <h1>Wait... why not? 😩😭</h1>
        <p>Select one or spill the tea 😝</p>

        <div class="choices">
            <button>I'm shy 🤭</button> 
            <button>You're too cute 🥺</button> 
            <button>Ummmh yess😩</button>  
            <button>I clicked by mistake 🫣</button>
        </div>
         
        <textarea placeholder="Or type your reason here..."></textarea>

        <button id="submitBtn">Submit 😻💌</button>
    </div>

    <script>
        const textarea = document.querySelector("textarea");
        const choiceButtons = document.querySelectorAll(".choices button");
        const submitBtn = document.getElementById("submitBtn");

       
        choiceButtons.forEach(button => {
            button.addEventListener("click", () => {
                textarea.value = button.textContent;
            });
        });

        // Submit logic
        submitBtn.addEventListener("click", () => {
            const reason = textarea.value.trim() || "I was just being mysterious 😌";

            localStorage.setItem("reason", reason);
            localStorage.setItem("cameFromWhy", "true");

            window.location.href = "index.html";
        });
    </script>

</body>
</html>
